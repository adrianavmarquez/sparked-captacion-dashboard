[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# La función /api/* se declara en netlify/functions/api.ts.
# Este catch-all no usa force, así que no pisa la función ni los archivos estáticos.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
